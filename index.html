<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عشر حاجات لنوتى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Almarai:wght@300;400;700&display=swap">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
/* Layout: one centered card stack, like a deck of love notes; freckle dots scattered across the page */
:root{
  --bg:#f7e4e2; --ink:#3a1622; --card:#fffaf8; --accent:#b23a5b; --muted:#8a5a66; --freckle:#c99a7e; --shadow:rgba(58,22,34,.16);
  --display:"Aref Ruqaa","Amiri",serif;
  --body:"Almarai","Tahoma",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f0f15; --ink:#f6dde2; --card:#2d1720; --accent:#ee7c99; --muted:#b98d98; --freckle:#7a4c3c; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f0f15; --ink:#f6dde2; --card:#2d1720; --accent:#ee7c99; --muted:#b98d98; --freckle:#7a4c3c; --shadow:rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow-x:hidden}
.freckles{position:fixed;inset:0;pointer-events:none;z-index:0}
.freckles i{position:absolute;border-radius:50%;background:var(--freckle);opacity:.55}
main{position:relative;z-index:1;direction:rtl;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-inline:16px;padding-block:32px;box-sizing:border-box;text-align:center}

.screen{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:420px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,11vw,3.6rem);line-height:1.25;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.lede{font-size:1.05rem;line-height:1.9;color:var(--muted);margin:0;max-width:30ch}

button{font-family:var(--body);font-weight:700;font-size:1rem;border:0;cursor:pointer;border-radius:999px;padding:14px 30px;background:var(--accent);color:var(--card);transition:transform .2s}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--muted);padding:12px 22px}
button:disabled{opacity:.3;cursor:default}

/* deck */
.deck{position:relative;width:min(100%,340px);aspect-ratio:3/4;max-width:100%}
.deck .behind{position:absolute;inset:0;background:var(--card);border-radius:22px;box-shadow:0 8px 24px var(--shadow)}
.deck .behind:nth-child(1){transform:rotate(-5deg) translate(-6px,8px);opacity:.6}
.deck .behind:nth-child(2){transform:rotate(3.5deg) translate(5px,4px);opacity:.8}
.card{position:absolute;inset:0;perspective:1200px;cursor:pointer;background:none;padding:0;border-radius:22px;color:var(--ink)}
.card .inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:22px;box-shadow:0 14px 34px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;box-sizing:border-box}
.face .num{font-family:var(--display);font-size:5.5rem;line-height:1;color:var(--accent)}
.face .word{font-family:var(--display);font-size:2.3rem;line-height:1.3}
.face .hint{font-size:.85rem;color:var(--muted);letter-spacing:.02em}
.back{transform:rotateY(180deg)}
.back .word{font-size:1.7rem;color:var(--accent)}
.back p{margin:0;font-size:1.2rem;line-height:2;font-weight:400}
.card.enter .inner{animation:deal .45s ease-out}
@keyframes deal{from{transform:translateY(24px) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}

.nav{display:flex;align-items:center;gap:18px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;min-width:5.5em}

.heart{width:58px;height:52px;position:relative}
.heart::before,.heart::after{content:"";position:absolute;top:0;width:30px;height:48px;background:var(--accent);border-radius:30px 30px 0 0}
.heart::before{left:29px;transform:rotate(-45deg);transform-origin:0 100%}
.heart::after{left:-1px;transform:rotate(45deg);transform-origin:100% 100%}
.beat{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.polaroid{background:#fffdfb;padding:10px 10px 34px;border-radius:4px;box-shadow:0 14px 30px var(--shadow);transform:rotate(-3deg);max-width:100%;box-sizing:border-box;margin:0}
.polaroid img{display:block;width:100%;height:auto;border-radius:2px}
.polaroid.tall{width:min(62vw,220px)}
.polaroid.wide{width:min(78vw,300px);transform:rotate(2.5deg)}
.small-heart{transform:scale(.55);margin-block:-10px}
.sign{font-family:var(--display);font-size:1.6rem;color:var(--accent);margin:0}

@media (prefers-reduced-motion: reduce){
  .card .inner{transition:none}.card.enter .inner,.beat{animation:none}
}
</style>
</head>

const $=id=>document.getElementById(id);
let i=0;

function show(screen){["intro","cards","end"].forEach(s=>$(s).hidden=s!==screen)}
function render(){
  const c=$("card");
  c.classList.remove("flipped","enter");void c.offsetWidth;c.classList.add("enter");
  $("fNum").textContent=ar(i+1);
  $("fWord").textContent=reasons[i][0];
  $("bWord").textContent=reasons[i][0];
  $("bText").textContent=reasons[i][1];
  $("bText").style.fontSize=reasons[i][1].length>90?"1.05rem":"";
  $("count").textContent=ar(i+1)+" من "+ar(reasons.length);
  $("prev").disabled=i===0;
  $("next").textContent=i===reasons.length-1?"الأخير":"اللي بعده";
}
$("start").onclick=()=>{i=0;show("cards");render()};
$("card").onclick=()=>$("card").classList.toggle("flipped");
$("next").onclick=()=>{if(i<reasons.length-1){i++;render()}else show("end")};
$("prev").onclick=()=>{if(i>0){i--;render()}};
$("again").onclick=()=>show("intro");
